name: Testes Mobile (Appium)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI: sobe um emulador Android, roda os testes e gera os relatórios
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4 # Appium (ferramentas Android) e Allure precisam de Java
        with:
          distribution: temurin
          java-version: "17"

      # Sem KVM o emulador roda sem aceleração de hardware e fica inutilizável de tão lento
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci

      # O APK tem ~120 MB: fica em cache entre execuções (a chave muda se a versão do app mudar)
      - name: Cache do app de exemplo
        uses: actions/cache@v4
        with:
          path: apps/*.apk
          key: apk-${{ hashFiles('tests/support/capabilities.js') }}

      - name: Prepare Appium driver and app
        run: npm run preparar

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: npx playwright test

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: appium-log
          path: appium.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure report to GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  # CD: publica o relatório Allure no GitHub Pages (só na main)
  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
